<script type="module">
import * as THREE from 'three';

// ---------- tuning ----------
const T = {
  ballOfShort: 1,     // ball's outline as a share of the screen's short side (1 = touches both edges)
  fling: 1.4,         // spin speed / finger speed (1 = the ball's surface keeps up with the finger)
  mouseGain: 2,       // a mouse drag is slower than a finger flick
  maxSpin: 45,        // cap on spin (radians/s)
  fricK: 0.75,        // spin slows by this share per second ... (was 0.55)
  fricC: 1.6,         // ... plus this much (rad/s per second), so it comes to a stop (was 1.2)
  settleAt: 4,        // below this spin the ball rolls over to show its window
  spring: 60,         // how firmly it rolls to the window (was 38)
  revealDelay: 0.05,  // pause before the answer rises (s) (was 0.25)
  revealTime: 0.8,    // answer fades up through the liquid (s) (was 1.5)
  shakeMin: 12,       // phone acceleration that counts as a shake (m/s²)
};

// Answers live in answers.txt (Mark edits it). This copy is the backup if that file is missing or empty.
const BACKUP_ANSWERS = [
  "Obviously", "Duh, yes", "Did you even need to ask?", "Fine, yes", "Yes, now shoo",
  "Yes. You're welcome", "Sure, why not", "I guess so", "Yes, genius", "Totally",
  "Even I saw that coming", "The stars say duh", "Yes. Was that so hard?", "Big yes", "Yep. Next!",
  "Is the sky blue?", "Is water wet?", "Do bears like honey?", "Do cats like naps?", "I'd say yes if I cared",
  "Yes. Now pay me", "Yes. Tell no one", "Yes, you lucky duck", "For a stud like you? Absolutely", "For a princess like you? Definitely",
  "I'm on break", "Ask nicely", "Shake harder", "No comment", "BRB, thinking",
  "Ask your mom", "Too sleepy. Later", "Can't hear you", "Who knows?", "Why are you asking a ball?",
  "Ask the cat", "I'm a ball, not a genius", "Loading...", "My brain is foggy", "Try bribing me",
  "I dare you to ask again", "50/50. Flip a coin", "Don't look at me", "Hey loser, try again tomorrow", "Did someone fart in here?",
  "You didn't just touch me with that dirty finger, did you?", "LOL, no", "Not a chance", "In your dreams", "Nice try",
  "Nope", "As if", "Not even close", "That's a no, chief", "Ha! No",
  "No. Don't ask again", "Big no", "Can pigs fly?", "Do fish ride bikes?", "When cows dance",
  "Not in a million years", "Sure, and I'm a toaster", "Error: too silly", "Hahaha. Oh, you're serious?", "The stars are laughing",

let ANSWERS = BACKUP_ANSWERS;
fetch('answers.txt?v=' + Date.now(), { cache: 'no-store' })
  .then(r => r.ok ? r.text() : '')
  .then(t => {
    const list = t.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('#'));
    if (list.length) { ANSWERS = list; recent.length = 0; }

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 3);

document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
// studio of soft boxes: the black gloss lives on these reflections
const pmrem = new THREE.PMREMGenerator(renderer);
function studio() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x030304);

    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m);

  box(1.2, 6, [6, 0.5, -2.5], 0xffeedd, 1.8);   // rim strip, right edge
  box(10, 3, [0, -6, 3], 0x3a2a1e, 0.6);        // warm table bounce below
  box(14, 14, [0, 10, 0], 0x50535c, 0.5);       // dim ceiling

}
scene.environment = pmrem.fromScene(studio(), 0.02).texture;
scene.environmentIntensity = 1;

const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
const key = new THREE.DirectionalLight(0xfff3e4, 2.2);
key.position.set(-3, 4, 6);
scene.add(key);
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x1a120c, 0.25));

function canvasTex(cv) {
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
const texS = DPR >= 2 ? 1024 : 512;

// ---------- the ball ----------
// Local frame: the 8 faces +z, the answer window faces -z.
const ball = new THREE.Group();
scene.add(ball);

// soft shadow on the backdrop, thrown down and to the right by the upper-left light
function shadowTexture() {
  const S = 512, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  gr.addColorStop(0, 'rgba(0,0,0,.85)'); gr.addColorStop(0.45, 'rgba(0,0,0,.72)');
  gr.addColorStop(0.75, 'rgba(0,0,0,.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);

}
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 3.4),
  new THREE.MeshBasicMaterial({ map: shadowTexture(), transparent: true, depthWrite: false, toneMapped: false }));
shadow.position.set(0.2, -0.5, -1.2);
shadow.renderOrder = -1;
scene.add(shadow);
const HOLE = 0.56;                         // window size, as an angle from the ball's centre
const rHole = Math.sin(HOLE), zRim = -Math.cos(HOLE);

const shellGeo = new THREE.SphereGeometry(1, 160, 120, 0, Math.PI * 2, HOLE, Math.PI - HOLE);
shellGeo.rotateX(-Math.PI / 2);            // the open pole ends up at -z
const blackGloss = new THREE.MeshPhysicalMaterial({
  color: 0x050506, roughness: 0.22, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03,
});
ball.add(new THREE.Mesh(shellGeo, blackGloss));

// white circle with the 8, printed on the front and under the same clear coat
const CAP = 0.5;
function eightTexture() {
  const S = texS, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.beginPath(); g.arc(S / 2, S / 2, S * 0.497, 0, Math.PI * 2); g.fillStyle = '#f4f2ec'; g.fill();
  g.fillStyle = '#0b0b0c';

  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  const m = g.measureText('8');
  const h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  g.fillText('8', S / 2, S / 2 + h / 2 - m.actualBoundingBoxDescent);
  return canvasTex(cv);
}
const capGeo = new THREE.SphereGeometry(1.0008, 160, 24, 0, Math.PI * 2, Math.PI - CAP, CAP);
capGeo.rotateX(-Math.PI / 2);              // the cap ends up at +z
{
  const p = capGeo.attributes.position, uv = capGeo.attributes.uv, R = Math.sin(CAP);
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / (2 * R) + 0.5, p.getY(i) / (2 * R) + 0.5);
  uv.needsUpdate = true;
}
ball.add(new THREE.Mesh(capGeo, new THREE.MeshPhysicalMaterial({
  map: eightTexture(), transparent: true, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.03,
  polygonOffset: true, polygonOffsetFactor: -2,
})));

// the window: a short dark well, deep blue liquid, the glow and answer, then the glass
const zLiquid = -0.76, zTri = -0.775, zGlass = zRim + 0.003;
const well = new THREE.CylinderGeometry(rHole, rHole * 0.97, zRim - zLiquid, 96, 1, true);
well.rotateX(Math.PI / 2); well.translate(0, 0, (zRim + zLiquid) / 2);
ball.add(new THREE.Mesh(well, new THREE.MeshStandardMaterial({ color: 0x02040c, roughness: 0.6, side: THREE.DoubleSide })));

function liquidTexture() {
  const S = 512, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(S * 0.5, S * 0.47, 0, S / 2, S / 2, S / 2);
  gr.addColorStop(0, '#0d1d5c'); gr.addColorStop(0.55, '#081344'); gr.addColorStop(1, '#01030d');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  return canvasTex(cv);
}
const liquidGeo = new THREE.CircleGeometry(rHole * 0.98, 96); liquidGeo.rotateY(Math.PI);
const liquid = new THREE.Mesh(liquidGeo, new THREE.MeshBasicMaterial({ map: liquidTexture() }));
liquid.position.z = zLiquid; ball.add(liquid);

// when the ball stops, blue light swells from the centre and fills the window; the answer floats in it
function glowTexture() {
  const S = 512, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  gr.addColorStop(0, 'rgba(110,160,255,1)'); gr.addColorStop(0.25, 'rgba(60,110,255,.75)');
  gr.addColorStop(0.6, 'rgba(30,60,210,.35)'); gr.addColorStop(0.9, 'rgba(15,30,140,.08)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  return canvasTex(cv);
}
const winGeo = new THREE.PlaneGeometry(rHole * 1.96, rHole * 1.96); winGeo.rotateY(Math.PI);
const glowMat = new THREE.MeshBasicMaterial({ map: glowTexture(), transparent: true, opacity: 0, depthWrite: false,
  blending: THREE.AdditiveBlending, toneMapped: false });
const glowMesh = new THREE.Mesh(winGeo, glowMat);
glowMesh.position.z = zLiquid - 0.006; ball.add(glowMesh);

const textCv = document.createElement('canvas'); textCv.width = textCv.height = texS;
const textTex = canvasTex(textCv);
function drawAnswer(text) {
  const S = texS, g = textCv.getContext('2d');
  g.clearRect(0, 0, S, S);

  // Biggest text that fits: at each size, try 1, 2, 3... lines centred in the circle, each line as wide as
  // the circle is at that height, and fill them word by word.
  let fs = S * 0.16, lh, lines = null;
  const setFont = () => {
    g.font = `700 ${Math.round(fs)}px "Segoe UI", Arial, sans-serif`;
    if ('letterSpacing' in g) g.letterSpacing = `${Math.round(fs * 0.03)}px`;
    lh = fs * 1.12;
  };
  const wrapInto = n => {
    const cy0 = S / 2 - (n - 1) * lh / 2, out = [];
    let w = 0;
    for (let i = 0; i < n; i++) {
      const y = cy0 + i * lh - S / 2, dy = Math.max(Math.abs(y - fs * 0.42), Math.abs(y + fs * 0.42));
      if (dy >= Rc) return null;
      const room = 2 * Math.sqrt(Rc * Rc - dy * dy);
      let line = '';
      while (w < words.length) {
        const next = line ? line + ' ' + words[w] : words[w];
        if (g.measureText(next).width > room) break;
        line = next; w++;
      }
      if (!line) return null;                     // a word too long for this line
      out.push(line);
      if (w === words.length) return out;
    }
    return null;
  };
  for (setFont(); fs > S * 0.04; fs *= 0.96, setFont()) {
    for (let n = 1; n * lh <= Rc * 1.9 && !lines; n++) lines = wrapInto(n);
    if (lines) break;
  }

  const cy = S / 2 - (lines.length - 1) * lh / 2;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(150,185,255,.9)'; g.shadowBlur = fs * 0.35;
  g.fillStyle = '#f4f7ff';
  lines.forEach((l, i) => g.fillText(l, S / 2, cy + i * lh));

}
const textMat = new THREE.MeshBasicMaterial({ map: textTex, transparent: true, opacity: 0, depthWrite: false, toneMapped: false });
const tri = new THREE.Mesh(winGeo, textMat);   // the floating answer
tri.position.z = zTri; ball.add(tri);

// glass: reflections only, added on top of what is behind it
const glassGeo = new THREE.CircleGeometry(rHole, 96); glassGeo.rotateY(Math.PI);
const glass = new THREE.Mesh(glassGeo, new THREE.MeshStandardMaterial({
  color: 0x000000, roughness: 0.06, metalness: 0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
}));
glass.position.z = zGlass; ball.add(glass);
const rimGeo = new THREE.TorusGeometry(rHole, 0.014, 16, 128);
const rim = new THREE.Mesh(rimGeo, blackGloss); rim.position.z = zRim; ball.add(rim);

// ---------- layout ----------
let W = 0, H = 0, Rpx = 100;
function layout() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  // distance where the sphere's true outline spans ballOfShort of the short side
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const tanShort = W < H ? tanV * camera.aspect : tanV;
  camera.position.set(0, 0, Math.sqrt(1 + 1 / (T.ballOfShort * tanShort) ** 2));
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
  Rpx = Math.min(W, H) * T.ballOfShort / 2;
}
addEventListener('resize', layout); layout();

// ---------- audio ----------
let ac = null, master = null, swishGain = null, swishBp = null, muted = true;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(ac.destination);
  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
  let b = 0; for (let i = 0; i < d.length; i++) { b = b * 0.97 + (Math.random() * 2 - 1) * 0.03; d[i] = b * 6; }
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  swishBp = ac.createBiquadFilter(); swishBp.type = 'bandpass'; swishBp.Q.value = 0.8; swishBp.frequency.value = 300;
  swishGain = ac.createGain(); swishGain.gain.value = 0;
  src.connect(swishBp).connect(swishGain).connect(master); src.start();
}
// a soft low "bloop" as the answer surfaces
function bloop() {
  if (!ac || muted) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = 'sine'; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(260, t + 0.35);
  f.type = 'lowpass'; f.frequency.value = 900;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 1);
}
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.classList.toggle('muted', muted);
  if (master) master.gain.value = muted ? 0 : 0.9;
});
function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

// ---------- spin state ----------
// phase: 'eight' (start, showing the 8) | 'held' | 'spin' | 'settle' | 'shown'
let phase = 'eight';
const omega = new THREE.Vector3();          // world-space spin (rad/s)
const target = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI); // window to the camera
let reveal = 0, revealT = 0, recent = [];
function pickAnswer() {
  let i;
  do { i = Math.random() * ANSWERS.length | 0; } while (recent.includes(i));
  recent.push(i);
  while (recent.length > Math.min(4, ANSWERS.length - 1)) recent.shift();   // no repeat of the last few
  drawAnswer(ANSWERS[i]);
  window.__ball.answer = ANSWERS[i];
}
function release(wx, wy) {
  omega.set(wx, wy, 0);
  if (omega.length() > T.maxSpin) omega.setLength(T.maxSpin);
  phase = 'spin';
}
const dq = new THREE.Quaternion(), ax = new THREE.Vector3();
function rotateBy(v, angle) {
  if (angle < 1e-7) return;
  dq.setFromAxisAngle(ax.copy(v).normalize(), angle);
  ball.quaternion.premultiply(dq).normalize();
}

// ---------- menu: two fingers touch the screen ----------
const touches = new Set();
addEventListener('pointerdown', e => {
  if (!started || menuOpen || e.pointerType !== 'touch') return;
  touches.add(e.pointerId);
  if (touches.size >= 2) { touches.clear(); openMenu(); }
}, { passive: true });
const liftTouch = e => touches.delete(e.pointerId);
addEventListener('pointerup', liftTouch, { passive: true });
addEventListener('pointercancel', liftTouch, { passive: true });
const menu = document.getElementById('menu');
let menuOpen = false, menuAt = 0;
document.getElementById('reload').addEventListener('click', () => location.replace(location.pathname + '?r=' + Date.now()));
function openMenu() {
  menuOpen = true; menuAt = performance.now();
  finger = null;
  if (phase === 'held') release(0, 0);           // a drag cut short by the second finger: let the ball settle
  menu.classList.add('open'); buzz(12);
}
function closeMenu() { menuOpen = false; menu.classList.remove('open'); }
menu.addEventListener('click', e => { if (e.target === menu && performance.now() - menuAt > 300) closeMenu(); });

// ---------- input ----------
let finger = null;
function fitVelocity(pts, windowMs) {
  const tEnd = pts[pts.length - 1].t;
  const w = pts.filter(p => tEnd - p.t <= windowMs);
  if (w.length < 2) return { vx: 0, vy: 0 };
  let st = 0, sx = 0, sy = 0, stt = 0, stx = 0, sty = 0; const n = w.length;
  for (const p of w) { const t = (p.t - tEnd) / 1000; st += t; sx += p.x; sy += p.y; stt += t * t; stx += t * p.x; sty += t * p.y; }

  if (Math.abs(den) < 1e-12) return { vx: 0, vy: 0 };

  for (const ev of (evs.length ? evs : [e])) {
    const prev = finger.pts[finger.pts.length - 1];
    const p = { x: ev.clientX, y: ev.clientY, t: ev.timeStamp };
    finger.pts.push(p);
    if (!finger.moved && Math.hypot(p.x - finger.pts[0].x, p.y - finger.pts[0].y) > 10) {
      finger.moved = true; phase = 'held'; omega.set(0, 0, 0);
    }
    // live push: the ball turns under the finger like a trackball
    if (finger.moved && prev) {
      const dx = p.x - prev.x, dy = p.y - prev.y;
      rotateBy(ax.set(dy, dx, 0), Math.hypot(dx, dy) / Rpx * (finger.mouse ? T.mouseGain : 1));

addEventListener('pointerdown', e => {
  if (!started || menuOpen || e.target.id === 'mute') return;
  const mouse = e.pointerType === 'mouse';
  if (mouse) {
    if (e.button !== 0) return;
    finger = null;
    try { document.documentElement.setPointerCapture(e.pointerId); } catch {}
  }

  finger = { id: e.pointerId, pts: [], mouse, moved: false };
  addPoints(e);
}, { passive: true });

  if (!cancelled) addPoints(e);
  if (finger.moved) {
    const { vx, vy } = fitVelocity(finger.pts, 45);
    const k = T.fling * (finger.mouse ? T.mouseGain : 1) / Rpx;
    release(vy * k, vx * k);
  } else if (!cancelled) {
    const b = finger.pts[finger.pts.length - 1];
    if (b.t - finger.pts[0].t < 300) checkDoubleTap(b);

addEventListener('pointerup', e => endFinger(e, false), { passive: true });
addEventListener('pointercancel', e => endFinger(e, true), { passive: true });
addEventListener('contextmenu', e => e.preventDefault());

// shake the phone (or S / Space on the PC): a random hard spin
function shakeSpin() {
  if (phase === 'held') return;
  const a = Math.random() * Math.PI * 2, s = 18 + Math.random() * 14;
  release(Math.cos(a) * s, Math.sin(a) * s);
  omega.z = (Math.random() - 0.5) * 8;
}
let gX = 0, gY = 0, gZ = 0, lastShake = 0;
addEventListener('devicemotion', e => {
  let x, y, z; const a = e.acceleration;
  if (a && a.x != null) { x = a.x; y = a.y; z = a.z; }
  else if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null) {
    const g = e.accelerationIncludingGravity;
    gX += (g.x - gX) * 0.1; gY += (g.y - gY) * 0.1; gZ += (g.z - gZ) * 0.1;
    x = g.x - gX; y = g.y - gY; z = g.z - gZ;
  } else return;
  const now = performance.now();
  if (started && !menuOpen && Math.hypot(x, y, z) > T.shakeMin && now - lastShake > 600) { lastShake = now; shakeSpin(); }
});
addEventListener('keydown', e => {
  if (!started) return;
  if (e.key === 's' || e.key === 'S' || e.key === ' ') { if (!menuOpen) shakeSpin(); }
  else if (e.key === 'm' || e.key === 'M') menuOpen ? closeMenu() : openMenu();
  else if (e.key === 'Escape') closeMenu();
});

// double tap: full screen on / off
let lastTap = null;
async function enterFullscreen() {
  const el = document.documentElement;
  try { if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' }); } catch {}
  try { await screen.orientation.lock('portrait'); } catch {}
}
function checkDoubleTap(p) {
  if (lastTap && p.t - lastTap.t < 350 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 50) {
    lastTap = null;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else enterFullscreen();
  } else lastTap = p;
}

let started = false;
document.getElementById('start').addEventListener('click', async () => {
  initAudio();
  document.getElementById('start').remove();
  started = true;
  try { if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission(); } catch {}
  await enterFullscreen();
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch {}
  layout();
});

// ---------- step ----------
const eq = new THREE.Quaternion(), errV = new THREE.Vector3();
function step(dt) {
  if (phase === 'spin' || phase === 'settle' || phase === 'shown') {
    const s = omega.length();
    if (s > 0) omega.multiplyScalar(Math.max(0, s - (T.fricK * s + T.fricC) * dt) / s);
    if (phase === 'spin' && omega.length() < T.settleAt) { phase = 'settle'; pickAnswer(); }
    if (phase !== 'spin') {
      // roll toward the window: a critically damped spring on the turn still needed
      eq.copy(target).multiply(ball.quaternion.clone().invert());
      if (eq.w < 0) eq.set(-eq.x, -eq.y, -eq.z, -eq.w);
      const ang = 2 * Math.acos(Math.min(1, eq.w)), sh = Math.sqrt(Math.max(0, 1 - eq.w * eq.w));
      if (sh > 1e-6) errV.set(eq.x / sh, eq.y / sh, eq.z / sh).multiplyScalar(ang); else errV.set(0, 0, 0);
      const D = 2 * Math.sqrt(T.spring);
      omega.addScaledVector(errV, T.spring * dt).addScaledVector(omega, -D * dt);
      if (phase === 'settle' && ang < 0.12 && omega.length() < 0.8) { phase = 'shown'; revealT = 0; }
    }
    rotateBy(omega, omega.length() * dt);
  }
}

let prev = performance.now(), clock = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - prev) / 1000)); prev = Math.max(prev, now); clock += dt;
  for (let i = 0; i < 4; i++) step(dt / 4);

  // the answer rises through the liquid, sways a little, sinks away on the next spin
  if (phase === 'shown') {
    const was = revealT;
    revealT += dt;
    if (was < T.revealDelay && revealT >= T.revealDelay) { bloop(); buzz(18); }
    const x = Math.min(1, Math.max(0, (revealT - T.revealDelay) / T.revealTime));
    reveal = x * x * (3 - 2 * x);
  } else reveal = Math.max(0, reveal - dt * 5);
  glowMat.opacity = reveal;
  textMat.opacity = reveal;
  tri.scale.setScalar(0.9 + 0.1 * reveal);
  tri.rotation.z = Math.sin(clock * 0.6) * 0.02;
  tri.position.y = Math.sin(clock * 0.8) * 0.006;

  if (swishGain) {
    const s = phase === 'held' ? 0 : omega.length();
    swishGain.gain.setTargetAtTime(Math.min(1, s / 30) * 0.22, ac.currentTime, 0.05);
    swishBp.frequency.setTargetAtTime(220 + s * 28, ac.currentTime, 0.05);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
window.__ball = { ball, omega, release, shakeSpin, drawAnswer, textCv, frame, openMenu, get menuOpen() { return menuOpen; }, get phase() { return phase; }, get reveal() { return reveal; }, answer: '' };
</script>
</body>
